[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rbacdiff"
version = "0.2.0"
description = "Diff RBAC role assignments AND effective permissions across systems/time; flag over-privilege, SoD, and risky grants."
readme = "README.md"
authors = [{ name = "Joshua John", email = "josh202@gmail.com" }]
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["rbac", "iam", "sod", "least-privilege", "audit", "compliance", "security"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rbacdiff = "rbacdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
