<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" font-family="SFMono-Regular,Consolas,Menlo,monospace">
  <rect width="800" height="390" rx="10" fill="#11111b"/>
  <rect width="800" height="34" rx="10" fill="#313244"/><rect y="20" width="800" height="14" fill="#313244"/>
  <circle cx="20" cy="17" r="6" fill="#f38ba8"/><circle cx="40" cy="17" r="6" fill="#f9e2af"/><circle cx="60" cy="17" r="6" fill="#a6e3a1"/>
  <text x="400" y="22" fill="#bac2de" font-size="12" text-anchor="middle">rbacdiff — quarterly access review</text>
  <text font-size="12.5" xml:space="preserve">
    <tspan x="18" y="62" fill="#6c7086"># diff: last quarter → now</tspan>
    <tspan x="18" y="84" fill="#a6e3a1">alice </tspan><tspan fill="#3fb950">+ ap_invoice_approve</tspan>
    <tspan x="18" y="104" fill="#a6e3a1">bob   </tspan><tspan fill="#f38ba8">- admin</tspan><tspan fill="#cdd6f4">  (deprovisioned)</tspan>
    <tspan x="18" y="124" fill="#a6e3a1">carol </tspan><tspan fill="#3fb950">+ reader</tspan><tspan fill="#cdd6f4">  (new joiner)</tspan>
  </text>
  <rect x="18" y="142" width="764" height="120" rx="8" fill="#2a1620" stroke="#7a2535"/>
  <text font-size="12.5" xml:space="preserve">
    <tspan x="34" y="168" fill="#f38ba8" font-weight="700">⚠ Separation-of-Duties violations</tspan>
    <tspan x="34" y="192" fill="#cdd6f4">  alice — AP segregation: holds both 'ap_invoice_create'</tspan>
    <tspan x="58" y="210" fill="#cdd6f4">and 'ap_invoice_approve'  (can create AND approve payments)</tspan>
    <tspan x="34" y="238" fill="#f9e2af" font-weight="700">⚠ Over-privilege</tspan>
  </text>
  <rect x="18" y="270" width="764" height="64" rx="8" fill="#2a2416" stroke="#7a6a20"/>
  <text font-size="12.5" xml:space="preserve">
    <tspan x="34" y="296" fill="#cdd6f4">  bob   — holds sensitive role(s): ['admin', 'security_admin']</tspan>
    <tspan x="34" y="318" fill="#cdd6f4">  alice — holds 3 roles (&gt; 2)</tspan>
  </text>
  <text x="18" y="362" font-size="12.5" fill="#a6e3a1">✓ 6 tests · works across two systems or two points in time · SoD rule packs</text>
  <text x="18" y="382" font-size="12" fill="#6c7086">grant/revoke diff · sensitive-role &amp; role-count thresholds · audit-ready output</text>
</svg>
